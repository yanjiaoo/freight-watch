name: 运费数据自动更新

on:
  schedule:
    # 每周一/三/五 UTC 9:00：抓运费动态 + 累积当月 FBX 读数（每月约13期，用于算月均值）
    - cron: '0 9 * * 1,3,5'
    # 每月1号 UTC 10:00：确保上个月及时结算成月度值（即使周内某次运行被跳过）
    - cron: '0 10 1 * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-now]  # 允许用只有 contents:write 的 PAT 手动触发

permissions:
  contents: write

jobs:
  update-freight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取最新运费动态
        run: python fetch-freight.py

      - name: 更新图表月度运价
        run: python update-chart.py

      - name: 更新原油月均价（EIA）
        run: python fetch-oil.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add freight-data.json freight-chart-data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: 更新运费数据 $(date +%Y-%m-%d)"
            git push
          fi
